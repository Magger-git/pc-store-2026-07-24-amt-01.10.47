<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Заказ оформлен — NODE.PC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container bar">
    <a href="/" class="logo"><span class="dot"></span>NODE.PC</a>
    <nav class="nav">
      <a href="/">Каталог</a>
      <a href="/builder.html">Конструктор сборки</a>
    </nav>
    <a href="/cart.html" class="cart-link">
      Корзина <span id="cart-count" class="cart-badge" style="display:none">0</span>
    </a>
  </div>
</header>

<section class="section">
  <div class="container" style="max-width:600px;text-align:center;padding:48px 24px">
    <div style="font-size:48px;margin-bottom:12px">✅</div>
    <h2>Заказ оформлен</h2>
    <p id="order-info" style="color:var(--text-dim)">Загружаем детали заказа…</p>
    <a href="/" class="btn btn-primary" style="margin-top:16px">Вернуться в каталог</a>
  </div>
</section>

<script src="js/api.js"></script>
<script src="js/nav-active.js"></script>
<script>
(async function () {
  const params = new URLSearchParams(location.search);
  const orderId = params.get("order");
  const info = document.getElementById("order-info");
  if (!orderId) {
    info.textContent = "Спасибо за заказ!";
    return;
  }
  try {
    const order = await API.getOrder(orderId);
    info.innerHTML = `Номер заказа <strong style="color:var(--accent)">${order.id}</strong> на сумму ${money(order.total)}. Подтверждение отправлено на ${order.customer.email}.`;
  } catch (e) {
    info.textContent = "Спасибо за заказ!";
  }
})();
refreshCartBadge();
</script>
</body>
</html>
