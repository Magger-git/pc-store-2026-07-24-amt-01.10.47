<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Корзина — NODE.PC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Chakra+Petch:wght@500;600;700&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container bar">
    <a href="/" class="logo"><span class="dot"></span>NODE.PC</a>
    <nav class="nav">
      <a href="/">Каталог</a>
      <a href="/builder.html">Конструктор сборки</a>
    </nav>
    <a href="/cart.html" class="cart-link">
      Корзина <span id="cart-count" class="cart-badge" style="display:none">0</span>
    </a>
  </div>
</header>

<section class="section">
  <div class="container" style="max-width:760px">
    <div class="section-head"><h2>Корзина</h2></div>
    <div id="cart-body"></div>
  </div>
</section>

<footer class="footer">
  <div class="container">NODE.PC — демонстрационный проект интернет-магазина. Все цены и наличие условны.</div>
</footer>

<script src="js/api.js"></script>
<script>
async function render() {
  const cart = await API.getCart();
  const body = document.getElementById("cart-body");

  if (!cart.items.length) {
    body.innerHTML = `
      <div class="empty-state">
        <div class="big">🛒</div>
        <p>Корзина пуста</p>
        <a href="/" class="btn btn-primary">Перейти в каталог</a>
      </div>`;
    return;
  }

  body.innerHTML = `
    <div>
      ${cart.items.map((i) => `
        <div class="cart-row">
          <div class="thumb-sm"><img src="img/${i.product.image}" alt=""></div>
          <div>
            <div style="font-weight:600;font-size:14px">${i.product.name}</div>
            <div style="font-size:12px;color:var(--text-dim)">${money(i.product.price)} / шт.</div>
          </div>
          <div class="qty-control">
            <button data-dec="${i.productId}">−</button>
            <span>${i.qty}</span>
            <button data-inc="${i.productId}">+</button>
          </div>
          <div style="text-align:right">
            <div style="font-family:var(--mono);font-weight:700">${money(i.subtotal)}</div>
            <button data-remove="${i.productId}" class="btn btn-ghost btn-sm" style="margin-top:6px;padding:4px 10px">Удалить</button>
          </div>
        </div>
      `).join("")}
    </div>
    <div style="display:flex;justify-content:space-between;align-items:center;padding:20px 0">
      <span style="font-size:16px">Итого</span>
      <span style="font-family:var(--mono);font-size:22px;font-weight:700">${money(cart.total)}</span>
    </div>
    <a href="/checkout.html" class="btn btn-primary btn-block notched">Оформить заказ</a>
  `;

  body.querySelectorAll("[data-inc]").forEach((b) => b.addEventListener("click", async () => {
    const item = cart.items.find((i) => i.productId === b.dataset.inc);
    await API.updateCart(b.dataset.inc, item.qty + 1);
    render(); refreshCartBadge();
  }));
  body.querySelectorAll("[data-dec]").forEach((b) => b.addEventListener("click", async () => {
    const item = cart.items.find((i) => i.productId === b.dataset.dec);
    await API.updateCart(b.dataset.dec, item.qty - 1);
    render(); refreshCartBadge();
  }));
  body.querySelectorAll("[data-remove]").forEach((b) => b.addEventListener("click", async () => {
    await API.removeFromCart(b.dataset.remove);
    render(); refreshCartBadge();
  }));
}

render();
</script>
</body>
</html>
