<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Готовая сборка — NODE.PC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="css/style.css">
</head>
<body>

<header class="site-header">
  <div class="container bar">
    <a href="/" class="logo"><span class="dot"></span>NODE.PC</a>
    <nav class="nav">
      <a href="/">Готовые сборки</a>
      <a href="/catalog.html">Каталог</a>
      <a href="/builder.html">Конструктор сборки</a>
    </nav>
    <a href="/cart.html" class="cart-link">
      Корзина <span id="cart-count" class="cart-badge" style="display:none">0</span>
    </a>
  </div>
</header>

<section class="section">
  <div class="container">
    <div id="breadcrumb" style="font-size:13px;color:var(--text-dim);margin-bottom:20px"></div>
    <div id="build-root"><p style="color:var(--text-dim)">Загрузка…</p></div>

    <div id="reviews-block" style="margin-top:56px;max-width:700px"></div>
  </div>
</section>

<footer class="footer">
  <img class="decor cable" src="img/decor/cable.svg" alt="">
  <img class="decor mouse" src="img/decor/mouse.svg" alt="">
  <div class="container">NODE.PC — демонстрационный проект интернет-магазина. Все цены и наличие условны.</div>
</footer>

<script src="js/api.js"></script>
<script>
const SLOT_LABELS = {
  cpu: "Процессор", motherboard: "Материнская плата", ram: "Оперативная память",
  gpu: "Видеокарта", cooler: "Охлаждение (СЖО)", storage: "Накопитель", psu: "Блок питания", case: "Корпус",
};
const TIER_LABELS = { budget: "Стартовая", mid: "Оптимальная", high: "Производительная", flagship: "Флагманская" };
const SLOT_ORDER = ["cpu", "motherboard", "cooler", "ram", "gpu", "storage", "psu", "case"];

function specLine(category, specs) {
  switch (category) {
    case "cpu": return `${specs.socket} · ${specs.cores} ядер · TDP ${specs.tdp}Вт`;
    case "motherboard": return `${specs.socket} · ${specs.ramType} · ${specs.formFactor}`;
    case "ram": return `${specs.type} · ${specs.capacityGB}ГБ · ${specs.speed}`;
    case "gpu": return `${specs.vramGB}ГБ VRAM · TDP ${specs.tdp}Вт`;
    case "cooler": return `${specs.radiatorSizeMM}мм · до ${specs.tdpRating}Вт · ${specs.sockets.join("/")}`;
    case "storage": return `${specs.type} · ${specs.capacityGB}ГБ`;
    case "psu": return `${specs.wattage}Вт · ${specs.certification}`;
    case "case": return `${specs.formFactors.join("/")} · до ${specs.maxGpuLengthMM}мм видеокарты`;
    default: return "";
  }
}

function stars(rating) {
  return "★".repeat(rating) + "☆".repeat(5 - rating);
}

async function renderReviews(buildId) {
  const block = document.getElementById("reviews-block");
  const reviews = await API.getBuildReviews(buildId);

  const avg = reviews.length ? (reviews.reduce((s, r) => s + r.rating, 0) / reviews.length).toFixed(1) : null;

  block.innerHTML = `
    <h3 style="font-family:var(--display);font-size:20px;margin-bottom:6px">
      Отзывы ${reviews.length ? `(${reviews.length})` : ""}
    </h3>
    ${avg ? `<p style="color:var(--text-dim);font-size:14px;margin-bottom:20px">Средняя оценка: ${avg} ${stars(Math.round(avg))}</p>` : `<p style="color:var(--text-dim);font-size:14px;margin-bottom:20px">Отзывов пока нет — будьте первым.</p>`}

    <div id="reviews-list" style="display:grid;gap:14px;margin-bottom:28px">
      ${reviews.map((r) => `
        <div style="background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:14px 16px">
          <div style="display:flex;justify-content:space-between;align-items:center;margin-bottom:6px">
            <strong style="font-size:14px">${escapeHtml(r.author)}</strong>
            <span style="color:var(--accent-dark);font-family:var(--mono);font-size:13px">${stars(r.rating)}</span>
          </div>
          <p style="font-size:13.5px;color:var(--text-dim);margin:0">${escapeHtml(r.text)}</p>
        </div>
      `).join("")}
    </div>

    <h4 style="font-family:var(--display);font-size:16px;margin-bottom:12px">Оставить отзыв</h4>
    <form class="checkout-form" id="review-form">
      <div>
        <label>Ваше имя</label>
        <input type="text" name="author" maxlength="60" required>
      </div>
      <div>
        <label>Оценка</label>
        <select name="rating" required style="width:100%;background:var(--bg-card);border:1px solid var(--border);border-radius:var(--radius-sm);padding:11px 13px;font-size:14px;font-family:var(--sans)">
          <option value="5">5 — отлично</option>
          <option value="4">4 — хорошо</option>
          <option value="3">3 — нормально</option>
          <option value="2">2 — так себе</option>
          <option value="1">1 — плохо</option>
        </select>
      </div>
      <div>
        <label>Отзыв</label>
        <textarea name="text" rows="4" maxlength="1000" required></textarea>
      </div>
      <button type="submit" class="btn btn-primary" style="justify-self:start">Отправить отзыв</button>
      <p id="review-error" style="color:var(--danger);font-size:13px;display:none"></p>
    </form>
  `;

  document.getElementById("review-form").addEventListener("submit", async (e) => {
    e.preventDefault();
    const form = e.target;
    const errorEl = document.getElementById("review-error");
    errorEl.style.display = "none";
    const payload = {
      author: form.author.value.trim(),
      rating: Number(form.rating.value),
      text: form.text.value.trim(),
    };
    const btn = form.querySelector("button[type=submit]");
    btn.disabled = true;
    const result = await API.addBuildReview(buildId, payload);
    btn.disabled = false;
    if (result.error) {
      errorEl.textContent = result.error;
      errorEl.style.display = "block";
      return;
    }
    renderReviews(buildId);
  });
}

function escapeHtml(s) {
  const div = document.createElement("div");
  div.textContent = s;
  return div.innerHTML;
}

async function init() {
  const params = new URLSearchParams(location.search);
  const id = params.get("id");
  const root = document.getElementById("build-root");
  const crumb = document.getElementById("breadcrumb");

  if (!id) {
    root.innerHTML = `<p>Сборка не найдена. <a href="/" style="color:var(--accent-dark)">Вернуться к готовым сборкам</a>.</p>`;
    return;
  }

  let build;
  try {
    build = await API.getBuild(id);
    if (build.error) throw new Error(build.error);
  } catch (e) {
    root.innerHTML = `<p>Сборка не найдена. <a href="/" style="color:var(--accent-dark)">Вернуться к готовым сборкам</a>.</p>`;
    return;
  }

  crumb.innerHTML = `<a href="/" style="color:var(--accent-dark)">Готовые сборки</a> / ${build.name}`;
  document.title = `${build.name} — NODE.PC`;

  const rows = SLOT_ORDER.filter((k) => build.components[k]).map((k) => {
    const p = build.components[k];
    return `
      <tr>
        <td>${SLOT_LABELS[k]}</td>
        <td>
          <a href="product.html?id=${p.id}" style="color:var(--text)">${p.brand} ${p.name}</a>
          <div style="font-size:12px;color:var(--text-dim);font-family:var(--mono)">${specLine(k, p.specs)}</div>
        </td>
        <td style="text-align:right;font-family:var(--mono)">${money(p.price)}</td>
      </tr>
    `;
  }).join("");

  root.innerHTML = `
    <div style="display:grid;grid-template-columns:380px 1fr;gap:40px;align-items:start">
      <div class="thumb" style="border-radius:var(--radius);padding:40px">
        <img src="img/${build.image}" alt="${build.name}" width="180" height="180">
      </div>
      <div>
        <div class="brand" style="font-size:13px">${TIER_LABELS[build.tier] || ""}</div>
        <h1 style="font-family:var(--display);font-size:30px;margin:6px 0 14px">${build.name}</h1>
        <p style="color:var(--text-dim);font-size:15px;max-width:560px;margin-bottom:20px">${build.description}</p>

        <div style="display:flex;align-items:center;gap:16px;margin-bottom:22px">
          <span class="price" style="font-size:28px">${money(build.price)}</span>
        </div>

        <div style="display:flex;gap:12px;margin-bottom:32px">
          <button class="btn btn-primary" id="add-build-btn" style="min-width:220px">Добавить сборку в корзину</button>
          <a href="/builder.html" class="btn btn-ghost">Изменить в конструкторе</a>
        </div>

        <h3 style="font-family:var(--display);font-size:17px;margin-bottom:10px">Состав сборки</h3>
        <table style="width:100%;max-width:620px;border-collapse:collapse;font-size:14px">
          <tbody>${rows}</tbody>
        </table>
      </div>
    </div>
  `;

  document.querySelectorAll("#build-root table tr").forEach((row) => {
    row.style.borderBottom = "1px solid var(--border)";
    row.querySelectorAll("td").forEach((td) => { td.style.padding = "12px 0"; td.style.verticalAlign = "top"; });
    const first = row.querySelector("td:first-child");
    if (first) { first.style.color = "var(--text-dim)"; first.style.width = "26%"; }
  });

  document.getElementById("add-build-btn").addEventListener("click", async () => {
    const btn = document.getElementById("add-build-btn");
    btn.disabled = true;
    btn.textContent = "Добавляем…";
    const groupId = "build-" + build.id + "-" + Date.now().toString(36);
    const groupLabel = "Сборка: " + build.name;
    for (const key of SLOT_ORDER) {
      const p = build.components[key];
      if (p) await API.addToCart(p.id, 1, groupId, groupLabel);
    }
    await refreshCartBadge();
    btn.textContent = "Добавлено ✓ — перейти в корзину";
    btn.onclick = () => (window.location.href = "/cart.html");
    btn.disabled = false;
  });

  renderReviews(build.id);
}

init();
</script>
</body>
</html>
