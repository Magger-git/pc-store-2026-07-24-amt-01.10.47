<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Админ-панель — NODE.PC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
<style>
  .admin-table { width: 100%; border-collapse: collapse; font-size: 13.5px; }
  .admin-table th { text-align: left; padding: 10px 12px; color: var(--text-dim); font-weight: 600; border-bottom: 1px solid var(--border); font-size: 12px; text-transform: uppercase; letter-spacing: 0.04em; }
  .admin-table td { padding: 10px 12px; border-bottom: 1px solid var(--border); vertical-align: middle; }
  .admin-table tr:hover td { background: var(--bg-elevated); }
  .admin-thumb { width: 40px; height: 40px; background: var(--bg-elevated); border-radius: 6px; display: flex; align-items: center; justify-content: center; }
  .admin-thumb img { width: 26px; height: 26px; }
  .tabs { display: flex; gap: 8px; margin-bottom: 24px; }
  .tab-btn { padding: 8px 16px; border-radius: 999px; border: 1px solid var(--border); background: var(--bg-card); cursor: pointer; font-size: 13.5px; font-weight: 500; }
  .tab-btn.active { background: var(--accent); border-color: var(--accent); color: #fff; }
  .form-grid { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
  .form-grid label { font-size: 12px; color: var(--text-dim); display: block; margin-bottom: 4px; }
  .form-grid input, .form-grid select, .form-grid textarea {
    width: 100%; padding: 9px 11px; border-radius: var(--radius-sm); border: 1px solid var(--border);
    background: var(--bg-elevated); font-size: 13.5px; color: var(--text); font-family: var(--sans);
  }
  .form-grid textarea { font-family: var(--mono); font-size: 12.5px; }
  .action-btn { border: none; background: none; cursor: pointer; font-size: 13px; padding: 4px 8px; border-radius: 6px; }
  .action-btn:hover { background: var(--bg-elevated); }
  .action-btn.danger { color: var(--danger); }
</style>
</head>
<body>

<header class="site-header">
  <div class="container bar">
    <a href="/" class="logo"><span class="dot"></span>NODE.PC <span style="font-family:var(--mono);font-size:12px;color:var(--text-dim);font-weight:400">/ admin</span></a>
    <button class="btn btn-ghost btn-sm" id="logout-btn">Выйти</button>
  </div>
</header>

<section class="section">
  <div class="container">
    <div class="tabs">
      <button class="tab-btn active" data-tab="products">Товары</button>
      <button class="tab-btn" data-tab="orders">Заказы</button>
    </div>

    <div id="tab-products">
      <div class="section-head">
        <h2>Товары <span class="count" id="products-count" style="font-size:14px"></span></h2>
        <button class="btn btn-primary btn-sm" id="new-product-btn">+ Добавить товар</button>
      </div>

      <div id="product-form-wrap" class="card" style="display:none;margin-bottom:24px;padding:20px">
        <h3 id="form-title" style="font-family:var(--display);margin:0 0 16px">Новый товар</h3>
        <form id="product-form">
          <input type="hidden" id="f-original-id">
          <div class="form-grid">
            <div>
              <label>ID (уникальный, латиницей)</label>
              <input type="text" id="f-id" required placeholder="cpu-example-1">
            </div>
            <div>
              <label>Категория</label>
              <select id="f-category" required>
                <option value="cpu">Процессоры</option>
                <option value="motherboard">Материнские платы</option>
                <option value="ram">Оперативная память</option>
                <option value="gpu">Видеокарты</option>
                <option value="cooler">Охлаждение (СЖО)</option>
                <option value="storage">Накопители</option>
                <option value="psu">Блоки питания</option>
                <option value="case">Корпуса</option>
              </select>
            </div>
            <div>
              <label>Бренд</label>
              <input type="text" id="f-brand" placeholder="AMD">
            </div>
            <div>
              <label>Название</label>
              <input type="text" id="f-name" required placeholder="Ryzen 5 7600">
            </div>
            <div>
              <label>Цена (₽)</label>
              <input type="number" id="f-price" required min="0" step="1">
            </div>
            <div>
              <label>Остаток на складе</label>
              <input type="number" id="f-stock" min="0" step="1" value="10">
            </div>
            <div>
              <label>Файл иконки (в public/img/)</label>
              <input type="text" id="f-image" placeholder="cpu.svg">
            </div>
            <div style="grid-column:1/-1">
              <label>Описание</label>
              <input type="text" id="f-description" placeholder="Короткое описание товара">
            </div>
            <div style="grid-column:1/-1">
              <label>Характеристики (JSON) — набор полей зависит от категории, см. README</label>
              <textarea id="f-specs" rows="4" placeholder='{"socket": "AM5", "cores": 6, "tdp": 65}'></textarea>
            </div>
          </div>
          <div id="form-error" class="issue error" style="display:none;margin-top:14px"></div>
          <div style="display:flex;gap:10px;margin-top:16px">
            <button type="submit" class="btn btn-primary">Сохранить</button>
            <button type="button" class="btn btn-ghost" id="cancel-form-btn">Отмена</button>
          </div>
        </form>
      </div>

      <div class="card" style="padding:0;overflow-x:auto">
        <table class="admin-table">
          <thead>
            <tr><th></th><th>Название</th><th>Категория</th><th>Цена</th><th>Остаток</th><th></th></tr>
          </thead>
          <tbody id="products-tbody"></tbody>
        </table>
      </div>
    </div>

    <div id="tab-orders" style="display:none">
      <div class="section-head"><h2>Заказы</h2></div>
      <div class="card" style="padding:0;overflow-x:auto">
        <table class="admin-table">
          <thead>
            <tr><th>Номер</th><th>Дата</th><th>Клиент</th><th>Сумма</th><th>Статус</th></tr>
          </thead>
          <tbody id="orders-tbody"></tbody>
        </table>
      </div>
    </div>
  </div>
</section>

<script>
const money = (n) => Number(n).toLocaleString("ru-RU") + " ₽";

async function checkAuth() {
  const res = await fetch("/api/admin/check");
  const data = await res.json();
  if (!data.authorized) {
    window.location.href = "/admin/login.html";
  }
}

async function api(path, options = {}) {
  const res = await fetch(`/api/admin${path}`, {
    headers: { "Content-Type": "application/json" },
    ...options,
  });
  if (res.status === 401) {
    window.location.href = "/admin/login.html";
    return null;
  }
  return res.json();
}

// ---------- Вкладки ----------
document.querySelectorAll(".tab-btn").forEach((btn) => {
  btn.addEventListener("click", () => {
    document.querySelectorAll(".tab-btn").forEach((b) => b.classList.remove("active"));
    btn.classList.add("active");
    document.getElementById("tab-products").style.display = btn.dataset.tab === "products" ? "block" : "none";
    document.getElementById("tab-orders").style.display = btn.dataset.tab === "orders" ? "block" : "none";
    if (btn.dataset.tab === "orders") loadOrders();
  });
});

// ---------- Товары ----------
async function loadProducts() {
  const products = await api("/products");
  if (!products) return;
  document.getElementById("products-count").textContent = `(${products.length})`;
  const tbody = document.getElementById("products-tbody");
  tbody.innerHTML = products.map((p) => `
    <tr>
      <td><div class="admin-thumb"><img src="../img/${p.image}" alt=""></div></td>
      <td><strong>${p.name}</strong><br><span style="color:var(--text-dim);font-size:12px">${p.brand}</span></td>
      <td>${p.category}</td>
      <td style="font-family:var(--mono)">${money(p.price)}</td>
      <td>${p.stock}</td>
      <td style="white-space:nowrap">
        <button class="action-btn" data-edit="${p.id}">Изменить</button>
        <button class="action-btn danger" data-delete="${p.id}">Удалить</button>
      </td>
    </tr>
  `).join("");

  tbody.querySelectorAll("[data-edit]").forEach((btn) => {
    btn.addEventListener("click", () => {
      const p = products.find((x) => x.id === btn.dataset.edit);
      openForm(p);
    });
  });
  tbody.querySelectorAll("[data-delete]").forEach((btn) => {
    btn.addEventListener("click", async () => {
      if (!confirm(`Удалить товар "${btn.dataset.delete}"? Это необратимо.`)) return;
      await api(`/products/${btn.dataset.delete}`, { method: "DELETE" });
      loadProducts();
    });
  });
}

function openForm(product) {
  document.getElementById("product-form-wrap").style.display = "block";
  document.getElementById("form-title").textContent = product ? "Редактировать товар" : "Новый товар";
  document.getElementById("f-original-id").value = product ? product.id : "";
  document.getElementById("f-id").value = product ? product.id : "";
  document.getElementById("f-id").disabled = !!product;
  document.getElementById("f-category").value = product ? product.category : "cpu";
  document.getElementById("f-brand").value = product ? product.brand : "";
  document.getElementById("f-name").value = product ? product.name : "";
  document.getElementById("f-price").value = product ? product.price : "";
  document.getElementById("f-stock").value = product ? product.stock : 10;
  document.getElementById("f-image").value = product ? product.image : "";
  document.getElementById("f-description").value = product ? product.description : "";
  document.getElementById("f-specs").value = product ? JSON.stringify(product.specs, null, 2) : "{}";
  document.getElementById("form-error").style.display = "none";
  document.getElementById("product-form-wrap").scrollIntoView({ behavior: "smooth" });
}

document.getElementById("new-product-btn").addEventListener("click", () => openForm(null));
document.getElementById("cancel-form-btn").addEventListener("click", () => {
  document.getElementById("product-form-wrap").style.display = "none";
});

document.getElementById("product-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const errBox = document.getElementById("form-error");
  errBox.style.display = "none";

  let specs;
  try {
    specs = JSON.parse(document.getElementById("f-specs").value || "{}");
  } catch (err) {
    errBox.textContent = "Характеристики должны быть корректным JSON. Проверьте кавычки и запятые.";
    errBox.style.display = "flex";
    return;
  }

  const originalId = document.getElementById("f-original-id").value;
  const payload = {
    id: document.getElementById("f-id").value.trim(),
    category: document.getElementById("f-category").value,
    brand: document.getElementById("f-brand").value.trim(),
    name: document.getElementById("f-name").value.trim(),
    price: Number(document.getElementById("f-price").value),
    stock: Number(document.getElementById("f-stock").value),
    image: document.getElementById("f-image").value.trim() || `${document.getElementById("f-category").value}.svg`,
    description: document.getElementById("f-description").value.trim(),
    specs,
  };

  const result = originalId
    ? await api(`/products/${originalId}`, { method: "PUT", body: JSON.stringify(payload) })
    : await api("/products", { method: "POST", body: JSON.stringify(payload) });

  if (result && result.error) {
    errBox.textContent = result.error;
    errBox.style.display = "flex";
    return;
  }

  document.getElementById("product-form-wrap").style.display = "none";
  loadProducts();
});

// ---------- Заказы ----------
async function loadOrders() {
  const orders = await api("/orders");
  if (!orders) return;
  const tbody = document.getElementById("orders-tbody");
  if (!orders.length) {
    tbody.innerHTML = `<tr><td colspan="5" style="color:var(--text-dim)">Заказов пока нет.</td></tr>`;
    return;
  }
  tbody.innerHTML = orders.map((o) => `
    <tr>
      <td style="font-family:var(--mono)">${o.id}</td>
      <td>${new Date(o.createdAt).toLocaleString("ru-RU")}</td>
      <td>${o.customer?.name || "—"}<br><span style="color:var(--text-dim);font-size:12px">${o.customer?.email || ""}</span></td>
      <td style="font-family:var(--mono)">${money(o.total)}</td>
      <td>${o.status}</td>
    </tr>
  `).join("");
}

document.getElementById("logout-btn").addEventListener("click", async () => {
  await fetch("/api/admin/logout", { method: "POST" });
  window.location.href = "/admin/login.html";
});

(async function init() {
  await checkAuth();
  loadProducts();
})();
</script>
</body>
</html>
