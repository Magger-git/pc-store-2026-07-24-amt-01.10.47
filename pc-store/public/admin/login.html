<!DOCTYPE html>
<html lang="ru">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<title>Вход в админ-панель — NODE.PC</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link href="https://fonts.googleapis.com/css2?family=Fraunces:ital,wght@0,500;0,600;1,500;1,600&family=Inter:wght@400;500;600;700&family=JetBrains+Mono:wght@400;500;700&display=swap" rel="stylesheet">
<link rel="stylesheet" href="../css/style.css">
</head>
<body>

<div style="min-height:100vh;display:flex;align-items:center;justify-content:center;padding:24px">
  <div class="card" style="width:100%;max-width:360px;padding:32px">
    <div class="logo" style="margin-bottom:8px"><span class="dot"></span>NODE.PC</div>
    <h1 style="font-family:var(--display);font-size:22px;margin:0 0 20px">Админ-панель</h1>

    <form id="login-form">
      <label style="font-size:13px;color:var(--text-dim);display:block;margin-bottom:6px">Пароль</label>
      <input type="password" id="password" required autofocus
        style="width:100%;padding:11px 13px;border-radius:var(--radius-sm);border:1px solid var(--border);background:var(--bg-elevated);font-size:14px;color:var(--text);margin-bottom:14px">
      <div id="error" class="issue error" style="display:none"></div>
      <button type="submit" class="btn btn-primary btn-block">Войти</button>
    </form>

    <a href="/" style="display:block;text-align:center;margin-top:18px;font-size:13px;color:var(--text-dim)">← Вернуться на сайт</a>
  </div>
</div>

<script>
document.getElementById("login-form").addEventListener("submit", async (e) => {
  e.preventDefault();
  const password = document.getElementById("password").value;
  const errBox = document.getElementById("error");
  errBox.style.display = "none";

  try {
    const res = await fetch("/api/admin/login", {
      method: "POST",
      headers: { "Content-Type": "application/json" },
      body: JSON.stringify({ password }),
    });
    const data = await res.json();
    if (!res.ok) {
      errBox.textContent = data.error || "Ошибка входа";
      errBox.style.display = "flex";
      return;
    }
    window.location.href = "/admin/";
  } catch (err) {
    errBox.textContent = "Не удалось связаться с сервером";
    errBox.style.display = "flex";
  }
});
</script>
</body>
</html>
